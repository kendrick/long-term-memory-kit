name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # The committed generated files are what an agent in the demo Bank reads; fail when the renderer drifts from them.
      - run: bun src/cli/bin.ts init --check fixtures/demo-bank

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python3 scripts/check-schema.py
      - run: python3 scripts/check-schema.py fixtures/formatter/before/*.md
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  formatters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bash scripts/check-formatters.sh
      # git diff ignores untracked files, so a copy missing from the commit would regenerate silently; the porcelain check catches it.
      - run: bash scripts/regen-reflowed.sh && git diff --exit-code fixtures/reflowed && test -z "$(git status --porcelain --untracked-files=all fixtures/reflowed)"
      # Exit 1 alone could come from the quoted-title Record, so the grep also requires the long-list break. Exit 2 (broken setup) still fails.
      - name: check-formatters.sh --no-overrides fails as expected
        run: |
          set +e
          out="$(bash scripts/check-formatters.sh --no-overrides)"
          rc=$?
          printf '%s\n' "$out"
          test "$rc" -eq 1 && grep -Fxq 'prettier: shared-queue-for-events-aB3cD4eF5g.md: frontmatter changed' <<<"$out"
