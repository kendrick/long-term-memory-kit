name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # The committed generated files are what an agent in the demo Bank reads; fail when the renderer drifts from them.
      - run: bun src/cli/bin.ts init --check fixtures/demo-bank

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @anthropic-ai/claude-code@2.1.294
      # With marketplace.json present, `validate .` checks only the marketplace, so plugin.json needs its own run. No --strict: the root CLAUDE.md always draws a warning.
      - run: claude plugin validate .
      - run: claude plugin validate .claude-plugin/plugin.json

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python3 scripts/check-schema.py
      - run: python3 scripts/check-schema.py fixtures/formatter/before/*.md
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  formatters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bash scripts/check-formatters.sh
      # git diff ignores untracked files, so a copy missing from the commit would regenerate silently; the porcelain check catches it.
      - run: bash scripts/regen-reflowed.sh && git diff --exit-code fixtures/reflowed && test -z "$(git status --porcelain --untracked-files=all fixtures/reflowed)"
      # Exit 1 alone could come from the quoted-title Record, so the grep also requires the long-list break. Exit 2 (broken setup) still fails.
      - name: check-formatters.sh --no-overrides fails as expected
        run: |
          set +e
          out="$(bash scripts/check-formatters.sh --no-overrides)"
          rc=$?
          printf '%s\n' "$out"
          test "$rc" -eq 1 && grep -Fxq 'prettier: shared-queue-for-events-aB3cD4eF5g.md: frontmatter changed' <<<"$out"

  actionlint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      # Pinned here rather than read from the release's checksums file, which would come from the same place as the tarball.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          curl -fsSL --retry 3 -O "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $tarball" | sha256sum -c
          tar -xzf "$tarball" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - run: actionlint templates/github/workflows/*.yml .github/workflows/*.yml

  # Proves the shipped ltm-validate.yml works, so the steps after Build ltm must stay the template's steps after Install ltm; test/core/dogfood-workflow.test.ts enforces that.
  ltm-validate-dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Build ltm
        run: |
          bun build --compile src/cli/bin.ts --outfile "$RUNNER_TEMP/ltm/ltm"
          echo "$RUNNER_TEMP/ltm" >> "$GITHUB_PATH"
      - run: ltm validate --format github
        working-directory: fixtures/demo-bank
      - run: ltm init --check
        working-directory: fixtures/demo-bank
