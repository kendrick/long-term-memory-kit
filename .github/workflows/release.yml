name: Release

on:
  push:
    tags: ['v*']
  # Every publish step gates on `push`, so a dispatch is always a dry run.
  workflow_dispatch:
  # workflow_dispatch only appears once this file is on the default branch, so PRs touching the release path get their dry run here. src/** is left out on purpose: five cross-builds per source PR cost more than they catch, and the tag run builds from source anyway.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/build-binaries.sh'
      - 'scripts/smoke-binary.sh'
      - 'scripts/build-npm.ts'
      - 'scripts/publish-npm.sh'
      - 'npm/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bash scripts/build-binaries.sh
      # SHA256SUMS holds bare file names, so check from inside dist/.
      - run: sha256sum -c SHA256SUMS
        working-directory: dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Artifacts drop the executable bit.
      - run: chmod +x dist/ltm-*
      - run: bash scripts/smoke-binary.sh dist/ltm-linux-x64

  smoke-macos:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: chmod +x dist/ltm-*
      - run: bash scripts/smoke-binary.sh dist/ltm-darwin-arm64

  # Only tag pushes trigger `push`, so this gate means "real release". Gating on github.ref would let a dispatch run on a tag ref publish. `release` waits on `npm` so a failed publish can't leave a Release whose packages never reached the registry.
  release:
    if: github.event_name == 'push'
    needs: [smoke-linux, smoke-macos, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: chmod +x dist/ltm-*
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes dist/ltm-* dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}

  npm:
    # Nothing ships unsmoked, so npm waits on both smoke jobs just like release does.
    needs: [smoke-linux, smoke-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: chmod +x dist/ltm-*
      - run: bun scripts/build-npm.ts
      - name: Publish (dry run)
        if: github.event_name != 'push'
        run: bash scripts/publish-npm.sh --dry-run
      # The token is scoped to this one step so the PR and dispatch paths never see it.
      - name: Publish
        if: github.event_name == 'push'
        run: bash scripts/publish-npm.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
