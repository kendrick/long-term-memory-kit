name: Release

on:
  push:
    tags: ['v*']
  # release-please.yml calls this after merging a release PR. A called workflow inherits the caller's event, so the `push` gates below still pass.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  # Every publish step gates on `push`, so a dispatch is always a dry run.
  workflow_dispatch:
  # workflow_dispatch only appears once this file is on the default branch, so PRs touching the release path get their dry run here. src/** is left out on purpose: five cross-builds per source PR cost more than they catch, and the tag run builds from source anyway.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/build-binaries.sh'
      - 'scripts/smoke-binary.sh'
      - 'scripts/sign-darwin.sh'
      - 'scripts/build-npm.ts'
      - 'scripts/publish-npm.sh'
      - 'npm/**'

permissions:
  contents: read

# A call runs on main, so GITHUB_REF_NAME there is the branch; the tag comes in as an input. Every checkout pins `ref` to it too: release-please can create a release on a later push than the release PR's merge, and the default checkout would then build that newer commit under the older tag. Outside a call `inputs.tag` is empty, which leaves checkout on its default ref.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bash scripts/build-binaries.sh
      # SHA256SUMS holds bare file names, so check from inside dist/.
      - run: sha256sum -c SHA256SUMS
        working-directory: dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Artifacts drop the executable bit.
      - run: chmod +x dist/ltm-*
      - run: bash scripts/smoke-binary.sh dist/ltm-linux-x64

  # bun's cross-compiled darwin binaries carry a signature that fails codesign, and macOS kills them at launch (#183), so a Mac re-signs them. It uploads a second artifact because smoke-linux and bench-gate read `dist` in parallel, and overwriting it under them would race.
  sign-macos:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: chmod +x dist/ltm-*
      - run: bash scripts/sign-darwin.sh dist
      - run: shasum -a 256 -c SHA256SUMS
        working-directory: dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-signed
          path: dist/
          if-no-files-found: error

  smoke-macos:
    needs: sign-macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: dist-signed
          path: dist
      - run: chmod +x dist/ltm-*
      - run: bash scripts/smoke-binary.sh dist/ltm-darwin-arm64
      # The runner is arm64 and Rosetta isn't guaranteed, so x64 gets the signature check only.
      - run: codesign --verify --strict -v dist/ltm-darwin-x64

  # No `if:` on purpose: the dispatch dry run has to exercise the gate against the committed baseline too.
  bench-gate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: chmod +x dist/ltm-*
      # A tag names the version being released; PR and dispatch runs have no tag, so they bench as package.json's version.
      - run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then v="${TAG#v}"; else v="$(bun -p 'require("./package.json").version')"; fi
          bun scripts/eval-bench.ts --ltm dist/ltm-linux-x64 --version "$v" --out "$RUNNER_TEMP/bench.json"
      - run: bun scripts/eval-gate.ts "$RUNNER_TEMP/bench.json"

  # Reports, never gates (#25), so nothing needs it. Push-only so model spend lands on tags, not on every PR or dispatch.
  plugin-eval:
    needs: build
    if: github.event_name == 'push'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      # `if:` can't read secrets, so check through env; a fork or rotated key then skips instead of failing.
      - id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is empty; skipping the plugin eval."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - if: steps.key.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - if: steps.key.outputs.present == 'true'
        run: bun install --frozen-lockfile
      # Pinned to the CLI whose `plugin eval` flags eval-plugin.ts was written against.
      - if: steps.key.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.311
      - if: steps.key.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # The plugin shells out to a bare `ltm`, so the binary has to be on PATH under that name.
      - if: steps.key.outputs.present == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 dist/ltm-linux-x64 "$RUNNER_TEMP/bin/ltm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - if: steps.key.outputs.present == 'true'
        run: |
          v="${TAG#v}"
          echo "PLUGIN_EVAL_VERSION=$v" >> "$GITHUB_ENV"
          bun scripts/eval-plugin.ts --version "$v"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # always(): a below-threshold score exits nonzero, and that is the report worth keeping.
      - if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: plugin-eval
          path: evals/results/${{ env.PLUGIN_EVAL_VERSION }}/plugin-eval.json
          if-no-files-found: warn

  # Only tag pushes trigger `push`, so this gate means "real release". Gating on github.ref would let a dispatch run on a tag ref publish. `release` doesn't wait on `npm`, which is optional: every other install method downloads these binaries, so a failed or skipped publish mustn't hold them back. It lists bench-gate itself, since it used to reach bench-gate only through `npm`.
  release:
    if: github.event_name == 'push'
    needs: [sign-macos, smoke-linux, smoke-macos, bench-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: dist-signed
          path: dist
      - run: chmod +x dist/ltm-*
      - run: sh scripts/build-install.sh "$TAG" > dist/install.sh
      # release-please leaves a draft Release with its changelog; a hand-pushed tag has none yet.
      - run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/ltm-* dist/SHA256SUMS dist/install.sh
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes dist/ltm-* dist/SHA256SUMS dist/install.sh
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  npm:
    # Nothing publishes unsmoked or below the committed bench hit rate.
    needs: [sign-macos, smoke-linux, smoke-macos, bench-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist-signed
          path: dist
      - run: chmod +x dist/ltm-*
      - run: bun scripts/build-npm.ts
      - name: Publish (dry run)
        if: github.event_name != 'push'
        run: bash scripts/publish-npm.sh --dry-run
      # The token is scoped to this one step so the PR and dispatch paths never see it.
      - name: Publish
        if: github.event_name == 'push'
        run: bash scripts/publish-npm.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Nothing needs this: the tap is one more install path, so a failed or skipped update mustn't hold back the Release or npm.
  homebrew:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # `if:` can't read secrets, so check through env; a fork or rotated token then skips instead of failing.
      - id: token
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is empty; skipping the Homebrew tap update."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - if: steps.token.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # The published SHA256SUMS, not the build artifact, so the formula pins exactly what users download.
      - if: steps.token.outputs.present == 'true'
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
        env:
          GH_TOKEN: ${{ github.token }}
      # Written to a file before the tap is touched, so a SHA256SUMS missing an asset fails here and nothing reaches the tap.
      - if: steps.token.outputs.present == 'true'
        run: bun scripts/homebrew-formula.ts "${TAG#v}" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/ltm.rb"
      - if: steps.token.outputs.present == 'true'
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/kendrick/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          # A re-run of an old tag, or an older tag's run finishing last, would otherwise roll the tap back to an older ltm, and `brew upgrade` would then offer nothing newer.
          new="${TAG#v}"
          if [ -f Formula/ltm.rb ]; then
            cur="$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/ltm.rb)"
            if [ -n "$cur" ] && [ "$(printf '%s\n' "$new" "$cur" | sort -V | tail -n 1)" = "$cur" ]; then
              echo "::notice::The tap already has ltm $cur; not replacing it with $new."
              exit 0
            fi
          fi
          mkdir -p Formula
          cp "$RUNNER_TEMP/ltm.rb" Formula/ltm.rb
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::Formula/ltm.rb is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ltm.rb
          git commit -m "ltm $new"
          git push origin HEAD
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
